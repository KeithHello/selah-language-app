    <div class="content">

  <script>
    (function registerSelahServiceWorker() {
      if (!('serviceWorker' in navigator)) return;
      window.addEventListener('load', function () {
        var buildMeta = document.querySelector('meta[name="selah-build-id"]');
        var buildId = buildMeta && buildMeta.content ? buildMeta.content : 'dev';
        var workerUrl = new URL('selah_service_worker.js?v=' + encodeURIComponent(buildId), document.baseURI);
        navigator.serviceWorker.register(workerUrl, { scope: new URL('./', document.baseURI).pathname }).catch(function () {
          // The app remains usable online when a browser blocks service workers.
        });
      });
    }());
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('selah-loading');
      if (loading) loading.hidden = true;
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
