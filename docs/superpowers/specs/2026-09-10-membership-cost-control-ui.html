    const sentenceCard=()=>`<article class="sentence"><p class="tag">${icon('check')}已儲存在你的句子裡</p><p class="english" lang="en">I'd like to take things a little slower today.</p><p class="translation">今天想把步調放慢一點。</p><div class="sentence-footer"><button type="button" class="btn soft" data-action="audio-demo">${icon('audio')}聆聽這一句</button><span>語音由 AI 合成 · 已有音頻可重複聆聽</span></div></article>`;
    const views={
      plans:()=>`${intro('讓學習留在生活裡','把想說的話，變成每天的小進步。','先試著記下一句，再選擇適合你的學習方式。',true)}<div class="plans"><section class="plan-card"><div class="plan-heading"><h3>個人試用</h3><span class="pill">7 天體驗</span></div><p class="price trial">免費</p><p class="subline">首次個人表達生成成功後開始</p><ul class="benefits"><li><span>新增個人表達</span><strong>30 條</strong></li><li><span>新增 AI 配音</span><strong>3000 字符</strong></li><li><span>錄音轉寫</span><strong>5 分鐘</strong></li><li><span>長文整理</span><strong>3 次</strong></li></ul><button type="button" class="btn full" data-scene="daily">開始我的第一句</button><p class="card-foot">每個帳戶一次，無須付款</p></section><section class="plan-card monthly"><div class="plan-heading"><h3>月會員</h3><span class="small-label">持續練習</span></div><p class="price"><b>¥</b>39.9<small>人民幣／月</small></p><p class="subline">每個付費帳期，給日常表達留些空間</p><ul class="benefits"><li><span>新增個人表達</span><strong>300 條</strong></li><li><span>新增 AI 配音</span><strong>30000 字符</strong></li><li><span>錄音轉寫</span><strong>60 分鐘</strong></li><li><span>長文整理</span><strong>30 次</strong></li></ul><button type="button" class="btn primary full" data-scene="pending">開通月會員</button><p class="card-foot">主動續購，不自動扣款</p></section></div>${modelStrip()}<p class="plan-note">四項額度分別計算；新聲線、母語音軌與重新配音也計入新增配音。學習已有內容不消耗生成額度。<button type="button" data-action="plan-info">查看完整方案說明</button></p>`,
      daily:()=>`${intro('今天，也說一點自己的話','今天，有什麼想用英文說？','從生活裡的一個小念頭開始。',true)}<section class="input-card"><div class="input-head"><label for="thought">我想說的話</label><span class="pill">中文 → 英文</span></div><textarea id="thought" placeholder="例如：今天想把步調放慢一點。">今天想把步調放慢一點。</textarea><div class="input-foot"><span class="model-mini">${icon('spark')}OpenAI GPT 內容輔助<button type="button" class="icon-button" data-action="model-info" aria-label="了解 GPT 內容說明">${icon('info')}</button></span><button type="button" class="btn primary" data-action="generate">生成我的表達</button></div><p class="hint">AI 生成內容，請結合語境確認。</p></section><div id="generated-result"></div><aside class="quiet-card"><div><h3>熟悉的句子，多聽一次也很好。</h3><p>回到已儲存的內容，慢慢把英文變得自然。</p></div><button type="button" class="btn text" data-scene="library">去我的句子 →</button></aside>`,
      limit:()=>`${intro('我的句子 ／ 新增配音','這一期，先聽熟悉的句子。','文字學習與已有音頻仍可繼續使用。')}<section class="state-card"><div class="state-icon">${icon('audio')}</div><h3>本期新增配音已達上限</h3><p class="description">將於 <strong>10 月 10 日 09:00</strong> 恢復新增配音。已生成的音頻仍可聆聽，也可以繼續整理你的文字內容。</p><div class="context-panel"><strong>你的這句話已保留</strong>今天想把步調放慢一點。</div><div class="actions"><button type="button" class="btn primary" data-scene="library">聆聽已有內容</button><button type="button" class="btn text" data-scene="daily">繼續記下想說的話</button></div></section>`,
      expired:()=>`${intro('我的帳戶 ／ 個人試用','讓學習，繼續走下去。','已建立的內容會留在你的學習空間。',true)}<section class="state-card"><div class="state-icon warm">${icon('clock')}</div><h3>你的試用已結束</h3><p class="description">開通月會員，繼續生成自己的英文表達。你也可以先複習已有的句子與音頻。</p><div class="receipt"><div><span>月會員</span><strong>¥39.9 人民幣／月</strong></div><div><span>續購方式</span><strong>主動續購，不自動扣款</strong></div></div><div class="actions"><button type="button" class="btn primary" data-scene="plans">查看月會員方案</button><button type="button" class="btn text" data-scene="library">繼續學習已有內容</button></div></section>`,
      pending:()=>`${intro('我的帳戶 ／ 月會員','付款結果確認中','離開這個頁面後，也可以回來查看結果。')}<section class="state-card"><div class="state-icon">${icon('clock')}</div><h3>正在確認付款結果</h3><p class="description">請勿重複付款。確認到帳後，會員狀態會更新，並顯示這次的有效期限。</p><div class="receipt"><div><span>方案</span><strong>Selah 月會員</strong></div><div><span>金額</span><strong>¥39.9 人民幣</strong></div><div><span>付款狀態</span><strong>核驗中</strong></div></div><div class="actions"><button type="button" class="btn primary" data-action="check-payment">重新查詢付款</button><button type="button" class="btn text" data-scene="library">先去學習</button></div></section>`,
      paid:()=>`${intro('我的帳戶 ／ 月會員','給每天的練習，留一點空間。','你的會員已開通。')}<section class="state-card"><div class="state-icon green">${icon('check')}</div><h3>月會員已開通</h3><p class="description">可以繼續生成個人表達、配音、錄音轉寫與長文整理。</p><div class="receipt"><div><span>本期有效至</span><strong>10 月 10 日 09:00</strong></div><div><span>續購方式</span><strong>主動續購</strong></div></div><div class="actions"><button type="button" class="btn primary" data-scene="daily">開始今天的練習</button><button type="button" class="btn text" data-action="plan-info">查看方案說明</button></div></section>`,
      protected:()=>`${intro('今天 ／ 內容生成','先把這個念頭，好好留住。','新增服務暫停時，已儲存的內容仍可複習。')}<section class="state-card"><div class="state-icon">${icon('shield')}</div><h3>新增內容服務暫時無法使用</h3><p class="description">你的草稿已保留，可以稍後再回來生成。現在仍可閱讀已有句子，或聆聽本機已儲存的音頻。</p><div class="context-panel"><strong>草稿已保留</strong>今天想把步調放慢一點。</div><div class="actions"><button type="button" class="btn primary" data-scene="library">複習已有內容</button><button type="button" class="btn text" data-scene="daily">回到草稿</button></div></section><p class="service-note">這是服務暫時不可用，無須重複購買會員。</p>`,
      library:()=>`${intro('我的句子','熟悉一點，就自在一點。','反覆學習已有內容，不消耗生成額度。',true)}${sentenceCard()}<aside class="quiet-card"><div><h3>也可以記下新的念頭。</h3><p>先留住想說的話，想練習時再回來。</p></div><button type="button" class="btn text" data-scene="daily">記下一句 →</button></aside>`
    };
    const notes={plans:'購買前完整列出四項靜態權益。GPT 說明靠近方案，沒有剩餘用量、進度條或促銷倒數。這是獨立設計稿，所有互動僅切換本機展示狀態。',daily:'日常入口把注意力留給內容。GPT 來源提示輕量常駐；生成按鈕示範已保存結果，沒有真實模型請求，也不保存輸入。',limit:'只限制新增配音，不鎖住全部功能。本例假設下一期已續購，因此可展示確切恢復日期；未續購時改為提示本期結束日期與下一期續購條件。',expired:'試用到期後保留已有內容；先查看完整會員權益，再進入付款，不自動扣款。',pending:'付款結果以服務端核驗為準，前端跳轉不發權益。展示稿可點「重新查詢付款」查看模擬成功狀態，不會查真實訂單。',paid:'已開通頁只顯示會員狀態與有效期限，不放用量餘額。此為模擬狀態與示例日期，不代表實際帳戶已開通。',protected:'平台費用保護、上游故障與個人額度用盡分開處理。不誘導重複付款；保留草稿與學習入口，營運處置與補償在後台進行。',library:'已有音頻重聽不產生模型費用。本機快取優先；雲端下載仍由資源限額保護。此稿無音頻請求，播放按鈕只顯示互動說明。'};
    let currentScene='plans';
    function showScene(scene,focus=true){
      if(!views[scene]) return;
      currentScene=scene;
      document.getElementById('view').innerHTML=views[scene]();
      document.getElementById('scene-note').textContent=notes[scene];
      document.getElementById('breadcrumb').textContent=({plans:'我的帳戶 ／ 會員方案',daily:'今天 ／ 我的表達',limit:'我的句子 ／ 新增配音',expired:'我的帳戶 ／ 個人試用',pending:'我的帳戶 ／ 付款結果',paid:'我的帳戶 ／ 月會員',protected:'今天 ／ 內容生成',library:'我的句子 ／ 學習'})[scene];
      document.getElementById('account-status').textContent=({plans:'個人學習空間',daily:'我的學習空間',limit:'月會員',expired:'個人學習空間',pending:'付款核驗中',paid:'月會員',protected:'草稿已保留',library:'我的學習空間'})[scene];
      document.querySelectorAll('.scene-switch button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));
      const navScene=['plans','expired','pending','paid'].includes(scene)?'plans':scene==='library'||scene==='limit'?'library':'daily';
      document.querySelectorAll('[data-nav]').forEach(b=>{if(b.dataset.nav===navScene)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
      if(focus) document.getElementById('screen-title').focus({preventScroll:true});
    }
    function openInfo(kind){
      const title=document.getElementById('dialog-title'),content=document.getElementById('dialog-content');
      if(kind==='plan-info'){
        title.textContent='完整方案說明';
        content.innerHTML='<table><thead><tr><th scope="col">新增權益</th><th scope="col">7 天試用</th><th scope="col">月會員</th></tr></thead><tbody><tr><th scope="row">個人表達</th><td>30 條</td><td>300 條</td></tr><tr><th scope="row">AI 配音</th><td>3000 字符</td><td>30000 字符</td></tr><tr><th scope="row">錄音轉寫</th><td>5 分鐘</td><td>60 分鐘</td></tr><tr><th scope="row">長文整理</th><td>3 次</td><td>30 次</td></tr></tbody></table><p>試用從第一份個人表達生成成功並儲存後開始，有效 168 小時，每個帳戶一次。</p><p>月會員為人民幣 39.9 元，每個付費帳期享有上表權益。採主動續購，不自動扣款；有效期內續購會排在下一期，本期額度不提前重置。</p><p>四項額度分別計算。配音字符包含標點、空格、中文或英文音軌；新聲線與重新配音也計入。批次按成功儲存的表達條數計算，長文整理與其後的表達生成分別計量。</p><p>轉寫按實際音頻時長計量，單次最長 3 分鐘、檔案最大 10 MiB。連續快速操作可能需要稍候。已有內容可繼續學習，重聽本機音頻不消耗生成額度。</p>';
      }else if(kind==='model-info'){
        title.textContent='關於 AI 內容與語音';
        content.innerHTML='<p>使用 OpenAI GPT 模型生成與整理學習內容，協助你練習自然英文。</p><p>AI 生成內容，請結合語境確認。模型可能出錯；你可以先確認表達是否符合自己的意思，再加入日常練習。</p><p>語音由 AI 合成。</p>';
      }else{
        title.textContent='聆聽互動展示';
        content.innerHTML='<p>正式產品會播放已儲存的音頻，本次設計稿沒有呼叫播放或下載服務。</p><p>重聽已有音頻不消耗生成額度；新的語言音軌、聲線或重新配音會計入新增配音。</p>';
      }
      document.getElementById('details').showModal();
    }
    document.addEventListener('click',event=>{
      const b=event.target.closest('button');if(!b)return;
      if(b.dataset.scene){showScene(b.dataset.scene);return;}
      const action=b.dataset.action;
      if(action==='close-dialog'){document.getElementById('details').close();return;}
      if(['plan-info','model-info','audio-demo'].includes(action)){openInfo(action);return;}
      if(action==='check-payment'){showScene('paid');document.getElementById('announcement').textContent='展示狀態已切換為會員開通成功。';return;}
      if(action==='generate'){
        const thought=document.getElementById('thought');
        if(!thought.value.trim()){thought.setAttribute('aria-invalid','true');document.getElementById('announcement').textContent='請先記下一句想說的話。';thought.focus();return;}
        thought.removeAttribute('aria-invalid');
        document.getElementById('generated-result').innerHTML=sentenceCard();
        b.disabled=true;b.innerHTML=icon('check')+'<span>表達已儲存</span>';
        document.getElementById('scene-note').textContent='已展示固定英文樣例，用於檢視成功回饋與保存狀態。這不是對輸入內容的真實翻譯，沒有呼叫模型或保存任何資料。';
        document.getElementById('announcement').textContent='展示樣例已生成並呈現保存狀態。';
      }
    });
    document.addEventListener('input',event=>{if(event.target.id==='thought'){const b=document.querySelector('[data-action="generate"]');b.disabled=false;b.textContent='生成我的表達';event.target.removeAttribute('aria-invalid')}});
    showScene('plans',false);
  </script>
</body>
</html>
