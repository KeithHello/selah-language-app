<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="2040" viewBox="0 0 2560 2040" role="img" aria-labelledby="title desc">
  <title id="title">Selah 循环听 UI／UX 设计稿</title>
  <desc id="desc">静态界面设计，展示桌面设置、桌面播放、手机播放、自定义时长、迷你播放器及异常状态。30 句与倒计时均为示意数据，功能尚未实施。</desc>
  <defs>
    <style>
      text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1A1614}
      .muted{fill:#706B65}.accent{fill:#554B85}.label{font-size:21px;font-weight:600}
      .body{font-size:21px}.small{font-size:18px}.tiny{font-size:16px}
      .heading{font-size:32px;font-weight:700}.number{font-family:'JetBrains Mono','Consolas',monospace;font-variant-numeric:tabular-nums;font-size:76px;letter-spacing:2px}
      .line{fill:none;stroke:#706B65;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .surface{fill:#fff;stroke:#EBE7E1;stroke-width:1.5}.option{fill:#FDFBF8;stroke:#EBE7E1;stroke-width:1.5}
      .selected{fill:#F0EEF8;stroke:#8B7FC7;stroke-width:1.5}.cta{fill:#E06B54}.rule{stroke:#EBE7E1;stroke-width:1.5}
    </style>
    <g id="headphones" class="line"><path d="M2 15v-4a10 10 0 0 1 20 0v4"/><rect x="0" y="13" width="5" height="10" rx="2"/><rect x="19" y="13" width="5" height="10" rx="2"/></g>
    <g id="play"><path d="M0 0L0 20L16 10Z" fill="#1A1614"/></g>
    <g id="pause"><rect width="5" height="20" rx="1" fill="#1A1614"/><rect x="10" width="5" height="20" rx="1" fill="#1A1614"/></g>
    <g id="next"><path d="M0 0L0 20L14 10Z" fill="#1A1614"/><rect x="16" width="3" height="20" fill="#1A1614"/></g>
    <g id="check"><path d="M0 6L5 11L15 0" fill="none" stroke="#554B85" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="sidebar">
      <rect width="208" height="770" rx="16" fill="#FDFBF8"/>
      <line x1="208" x2="208" y1="0" y2="770" class="rule"/>
      <rect x="24" y="24" width="40" height="40" rx="13" fill="#E06B54"/>
      <path d="M44 54C29 48 33 38 44 46C46 31 57 35 51 47Z" fill="#fff"/>
      <text x="25" y="97" font-size="19" letter-spacing="4">SELAH</text>
      <text x="25" y="124" class="tiny muted">quiet growth</text>
      <text x="25" y="193" class="tiny muted">学习空间</text>
      <circle cx="39" cy="233" r="8" class="line"/><path d="M39 218v-4M39 252v-4M24 233h-4M58 233h-4" class="line"/>
      <text x="70" y="241" class="body muted">今天</text>
      <rect x="16" y="271" width="177" height="54" rx="14" fill="#FEF0ED"/>
      <use href="#headphones" transform="translate(27 284)"/>
      <text x="70" y="305" class="label">聆听</text>
      <path d="M32 356a11 11 0 1 1-3 13M32 356v-8M32 356h9" class="line"/><text x="70" y="377" class="body muted">练习</text>
      <path d="M26 426q7-5 13 0q7-5 13 0v20q-7-5-13 0q-6-5-13 0zM39 426v20" class="line"/><text x="70" y="445" class="body muted">笔记</text>
      <path d="M26 493h26M26 504h26M26 515h26M33 489v8M45 500v8M36 511v8" class="line"/><text x="70" y="513" class="body muted">设置</text>
      <rect x="16" y="709" width="177" height="42" rx="12" fill="#F8F5F0"/><text x="104" y="736" text-anchor="middle" class="tiny muted">本机学习中</text>
    </g>
    <g id="desktop-frame">
      <rect width="1184" height="770" rx="16" fill="#FBF8F4" stroke="#DCD6CE" stroke-width="1.5"/>
      <use href="#sidebar"/>
      <text x="246" y="45" class="label">聆听</text><line x1="209" y1="70" x2="1184" y2="70" class="rule"/>
      <rect x="254" y="96" width="310" height="52" rx="13" fill="#F0ECE6"/>
      <rect x="411" y="100" width="149" height="44" rx="10" fill="#fff"/>
      <text x="332" y="130" text-anchor="middle" class="body muted">逐句听</text><text x="485" y="130" text-anchor="middle" class="label">循环听</text>
      <rect x="254" y="176" width="890" height="550" rx="22" class="surface"/>
    </g>
  </defs>

  <rect width="2560" height="2040" fill="#F2EEE8"/>
  <text x="64" y="80" font-size="42" font-weight="700">SELAH · 循环听</text>
  <text x="2496" y="78" text-anchor="end" class="body muted">UI／UX 设计稿 · 2026.09.10</text>
  <text x="64" y="117" class="body muted">设好语序和时长，放下手机，持续收听。</text>
  <text x="64" y="170" class="label">01 · 桌面／播放前</text>
  <text x="1312" y="170" class="label">02 · 桌面／播放中</text>

  <g transform="translate(64 194)">
    <use href="#desktop-frame"/>
    <text x="290" y="229" class="heading">循环听</text>
    <text x="290" y="265" class="body muted">放松下来，让熟悉的句子陪着你。</text>
    <text x="290" y="309" class="small muted">全部句库 · 30 句</text>
    <text x="1107" y="309" text-anchor="end" class="small accent">查看列表 ›</text>
    <line x1="290" y1="334" x2="1108" y2="334" class="rule"/>
    <text x="290" y="371" class="label">播放顺序</text>
    <rect x="290" y="390" width="400" height="62" rx="12" class="selected"/>
    <use href="#check" transform="translate(321 415)"/>
    <text x="490" y="429" text-anchor="middle" class="label accent">英语 → 中文</text>
    <rect x="706" y="390" width="402" height="62" rx="12" class="option"/>
    <text x="907" y="429" text-anchor="middle" class="body muted">中文 → 英语</text>
    <text x="290" y="496" class="label">多久后停止</text>
    <rect x="290" y="515" width="192" height="58" rx="12" class="option"/><text x="386" y="552" text-anchor="middle" class="body muted">15 分钟</text>
    <rect x="498" y="515" width="192" height="58" rx="12" class="selected"/><text x="594" y="552" text-anchor="middle" class="label accent">30 分钟 ✓</text>
    <rect x="706" y="515" width="192" height="58" rx="12" class="option"/><text x="802" y="552" text-anchor="middle" class="body muted">60 分钟</text>
    <rect x="914" y="515" width="194" height="58" rx="12" class="option"/><text x="1011" y="552" text-anchor="middle" class="body muted">自定义</text>
    <text x="290" y="606" class="small muted">开始播放后计时，到时安静停止。</text>
    <rect x="290" y="627" width="818" height="58" rx="13" class="cta"/><use href="#play" transform="translate(612 646)"/>
    <text x="717" y="665" text-anchor="middle" class="label">开始循环听</text>
    <text x="699" y="710" text-anchor="middle" class="tiny muted">沿用当前声线与语速</text>
  </g>

  <g transform="translate(1312 194)">
    <use href="#desktop-frame"/>
    <text x="290" y="221" class="label">循环听</text><text x="1108" y="221" text-anchor="end" class="small muted">全部句库 · 30 句</text>
    <text x="699" y="330" text-anchor="middle" class="number">24:18</text>
    <text x="699" y="367" text-anchor="middle" class="small muted">后停止</text>
    <rect x="414" y="390" width="570" height="5" rx="3" fill="#EBE7E1"/><rect x="414" y="390" width="108" height="5" rx="3" fill="#8B7FC7"/>
    <rect x="542" y="426" width="180" height="38" rx="19" fill="#F0EEF8"/><text x="632" y="452" text-anchor="middle" class="small accent">正在播放英语</text>
    <text x="743" y="452" class="small muted">第 7／30 句</text>
    <text x="699" y="510" text-anchor="middle" font-size="28" font-weight="600">Let’s take it one step at a time.</text>
    <text x="699" y="549" text-anchor="middle" class="body muted">我们一步一步来。</text>
    <text x="699" y="581" text-anchor="middle" class="tiny muted">英语 → 中文</text>
    <rect x="476" y="601" width="190" height="58" rx="13" class="cta"/><use href="#pause" transform="translate(522 620)"/><text x="591" y="639" text-anchor="middle" class="label">暂停</text>
    <rect x="682" y="601" width="190" height="58" rx="13" class="option"/><use href="#next" transform="translate(714 620)"/><text x="791" y="639" text-anchor="middle" class="label">下一句</text>
    <text x="930" y="639" text-anchor="middle" class="small muted">结束</text>
    <line x1="290" y1="680" x2="1108" y2="680" class="rule"/><text x="290" y="708" class="small muted">播放列表</text><text x="1108" y="708" text-anchor="end" class="small muted">展开⌄</text>
  </g>

  <text x="64" y="1052" class="label">03 · 手机／播放中</text>
  <text x="572" y="1052" class="label">04 · 自定义时长</text>
  <text x="1472" y="1052" class="label">05 · 状态反馈</text>
  <g transform="translate(64 1080)">
    <rect width="440" height="856" rx="22" fill="#FBF8F4" stroke="#DCD6CE" stroke-width="1.5"/>
    <text x="24" y="47" class="label">聆听</text>
    <rect x="20" y="74" width="400" height="50" rx="12" fill="#F0ECE6"/><rect x="222" y="78" width="194" height="42" rx="9" fill="#fff"/>
    <text x="120" y="107" text-anchor="middle" class="body muted">逐句听</text><text x="318" y="107" text-anchor="middle" class="label">循环听</text>
    <rect x="20" y="148" width="400" height="580" rx="20" class="surface"/>
    <text x="44" y="186" class="label">循环听</text><text x="396" y="186" text-anchor="end" class="tiny muted">全部句库 · 30 句</text>
    <text x="220" y="287" text-anchor="middle" class="number" font-size="64">24:18</text>
    <text x="220" y="324" text-anchor="middle" class="small muted">后停止</text>
    <rect x="68" y="350" width="304" height="4" rx="2" fill="#EBE7E1"/><rect x="68" y="350" width="58" height="4" rx="2" fill="#8B7FC7"/>
    <rect x="134" y="382" width="172" height="36" rx="18" fill="#F0EEF8"/><text x="220" y="407" text-anchor="middle" class="small accent">正在播放英语</text>
    <text x="220" y="446" text-anchor="middle" class="small muted">第 7／30 句</text>
    <text x="220" y="489" text-anchor="middle" font-size="23" font-weight="600">Let’s take it</text><text x="220" y="523" text-anchor="middle" font-size="23" font-weight="600">one step at a time.</text>
    <text x="220" y="561" text-anchor="middle" class="body muted">我们一步一步来。</text>
    <rect x="44" y="598" width="164" height="56" rx="12" class="cta"/><use href="#pause" transform="translate(78 616)"/><text x="142" y="635" text-anchor="middle" class="label">暂停</text>
    <rect x="224" y="598" width="172" height="56" rx="12" class="option"/><use href="#next" transform="translate(247 616)"/><text x="320" y="635" text-anchor="middle" class="label">下一句</text>
    <text x="220" y="693" text-anchor="middle" class="small muted">结束</text>
    <text x="24" y="763" class="small muted">播放列表</text><text x="413" y="763" text-anchor="end" class="small muted">⌄</text>
    <line x1="0" y1="789" x2="440" y2="789" class="rule"/>
    <rect x="92" y="799" width="80" height="39" rx="12" fill="#FEF0ED"/>
    <text x="44" y="825" text-anchor="middle" class="tiny muted">今天</text><text x="132" y="825" text-anchor="middle" class="tiny">聆听</text><text x="220" y="825" text-anchor="middle" class="tiny muted">练习</text><text x="308" y="825" text-anchor="middle" class="tiny muted">笔记</text><text x="396" y="825" text-anchor="middle" class="tiny muted">设置</text>
  </g>

  <g transform="translate(572 1080)">
    <rect width="832" height="523" rx="18" fill="#E7E2DB"/>
    <rect x="94" y="77" width="644" height="370" rx="22" fill="#fff"/>
    <text x="130" y="132" class="heading">自定义时长</text><text x="130" y="183" class="label">多久后停止</text>
    <rect x="130" y="205" width="572" height="70" rx="12" fill="#fff" stroke="#554B85" stroke-width="2.5"/>
    <text x="154" y="253" font-size="34">45</text><text x="676" y="249" text-anchor="end" class="body muted">分钟</text>
    <text x="130" y="309" class="small muted">请输入 1～720 分钟的整数</text>
    <rect x="396" y="346" width="145" height="58" rx="12" class="option"/><text x="468" y="384" text-anchor="middle" class="label muted">取消</text>
    <rect x="557" y="346" width="145" height="58" rx="12" class="cta"/><text x="629" y="384" text-anchor="middle" class="label">确定</text>
  </g>
  <text x="572" y="1672" class="label">06 · 跨页迷你播放器</text>
  <g transform="translate(572 1700)">
    <rect width="832" height="110" rx="18" fill="#FDFBF8" stroke="#DCD6CE" stroke-width="1.5"/>
    <use href="#headphones" transform="translate(26 40)"/>
    <text x="77" y="46" class="label">循环听 · 第 7／30 句</text><text x="77" y="78" class="small muted">24:18 后停止</text>
    <rect x="660" y="27" width="56" height="56" rx="12" fill="#FEF0ED"/><use href="#pause" transform="translate(681 45)"/>
    <rect x="732" y="27" width="56" height="56" rx="12" class="option"/><path d="M748 66L770 44M749 44h21v21" class="line"/>
  </g>
  <text x="572" y="1848" class="small muted">手机端位于底部导航上方，给正文预留空间。</text>
  <text x="572" y="1884" class="small muted">返回「循环听」页后，由完整面板承接控制。</text>

  <g transform="translate(1472 1080)">
    <rect width="1024" height="204" rx="18" class="surface"/>
    <text x="30" y="45" class="label">准备音频</text><text x="994" y="45" text-anchor="end" class="small muted">42／60 段</text>
    <rect x="30" y="72" width="964" height="6" rx="3" fill="#EBE7E1"/><rect x="30" y="72" width="674" height="6" rx="3" fill="#8B7FC7"/>
    <text x="30" y="117" class="body muted">正在准备双语音频，完成后即可开始。</text><text x="30" y="162" class="small muted">准备期间不计时</text><text x="994" y="162" text-anchor="end" class="small muted">取消准备</text>
    <rect y="228" width="1024" height="204" rx="18" class="surface"/>
    <text x="30" y="273" class="label">已暂停</text><text x="994" y="273" text-anchor="end" class="small muted">24:18 后停止</text>
    <text x="30" y="321" class="body muted">暂停期间倒计时继续。</text>
    <rect x="810" y="345" width="184" height="56" rx="12" class="cta"/><text x="902" y="382" text-anchor="middle" class="label">继续播放</text>
    <rect y="456" width="1024" height="224" rx="18" class="surface"/>
    <text x="30" y="501" class="label">有 2 句音频未准备好</text><text x="30" y="548" class="body muted">重试后继续准备完整句库。</text>
    <text x="30" y="605" class="small accent">查看详情 ›</text><rect x="810" y="584" width="184" height="56" rx="12" class="cta"/><text x="902" y="621" text-anchor="middle" class="label">重试缺失音频</text>
    <rect y="704" width="1024" height="152" rx="18" class="surface"/>
    <text x="30" y="752" class="label">本次循环听已结束</text><text x="30" y="800" class="body muted">到时自动停止，不播放提醒音。</text><text x="994" y="800" text-anchor="end" class="small accent">再听一次 ›</text>
  </g>
  <line x1="64" y1="1971" x2="2496" y2="1971" stroke="#DCD6CE"/>
  <text x="64" y="2010" class="tiny muted">静态设计稿 · 数量与句子均为示意 · 详细交互、边界和开发顺序以配套设计文档为准</text>
  <text x="2496" y="2010" text-anchor="end" class="tiny muted">仅设计与规划／尚未实施</text>
</svg>
